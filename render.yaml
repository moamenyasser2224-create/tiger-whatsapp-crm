services:
  # Backend Web Service
  - type: web
    name: tiger-crm-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: tiger-crm-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_RESET_PASSWORD_SECRET
        generateValue: true
      - key: PHONE_ENCRYPTION_KEY
        generateValue: true

  # Frontend Static Web Service
  - type: web
    name: tiger-crm-frontend
    env: static
    plan: free
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://tiger-crm-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: tiger-crm-db
    plan: free
    databaseName: whatsapp_crm
    user: crm_user
