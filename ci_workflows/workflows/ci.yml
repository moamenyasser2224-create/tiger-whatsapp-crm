name: Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-and-test:
    name: Lint, Typecheck, and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: whatsapp_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Server Typecheck & Lint
        working-directory: ./server
        run: npm run lint

      - name: Client Typecheck & Lint
        working-directory: ./client
        run: npm run lint

      - name: Run Prisma Migration & Generate (Server)
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whatsapp_crm_test?schema=public
          JWT_ACCESS_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          JWT_RESET_PASSWORD_SECRET: reset_secret_key_minimum_32_characters_long_1234567890
          PHONE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Run Server Unit & Integration Tests
        working-directory: ./server
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whatsapp_crm_test?schema=public
          JWT_ACCESS_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          JWT_RESET_PASSWORD_SECRET: reset_secret_key_minimum_32_characters_long_1234567890
          PHONE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npm run test

      - name: Run Client Vitest Tests
        working-directory: ./client
        run: npm run test

      - name: Build Server
        working-directory: ./server
        run: npm run build

      - name: Build Client
        working-directory: ./client
        run: npm run build

      - name: Validate Docker Builds
        run: |
          docker build -t whatsapp-crm-server:test ./server
          docker build -t whatsapp-crm-client:test ./client
