# ==============================================================================
# TIGER WORKSPACE CRM: CLOUDFLARE ORIGIN REVERSE PROXY NGINX CONFIGURATION
# Defense in Depth: Origin Cloaking, Strict TLS 1.2+, HSTS, Real IP Restoration
# ==============================================================================

# 1. Cloudflare Official IP Ranges (Restore Real Client IP)
# Ensures rate limiters and audit logs record real visitor IP, not Cloudflare's edge IP.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# Upstream Application Daemon
upstream tiger_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# HTTP: Redirect all traffic to Cloudflare HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tiger.yourdomain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Cloudflare Authenticated Origin Pull
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tiger.yourdomain.com;

    # SSL Certificates (Cloudflare Origin CA Certificate or Let's Encrypt)
    ssl_certificate /etc/ssl/certs/tiger_origin.pem;
    ssl_certificate_key /etc/ssl/private/tiger_origin.key;

    # TLS Hardening: Strictly TLS 1.2 and TLS 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Mandatory HSTS (HTTP Strict Transport Security) - 2 Years
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Buffer & Body Limit Hardening (Mitigate Slowloris / Memory Exhaustion)
    client_max_body_size 5M;
    client_body_buffer_size 128k;

    # WebSocket & API Proxy
    location / {
        proxy_pass http://tiger_backend;
        proxy_http_version 1.1;

        # WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Request Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Cloudflare Keep-Alive Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
