name: Tiger Enterprise Security & CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly dependency & vulnerability audit every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # 1. Supply Chain & Dependency Audit
  # --------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit & Lockfile Validation (npm ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Enforce Strict Deterministic Install (npm ci)
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server

      - name: Run NPM Security Vulnerability Audit
        run: |
          echo "Scanning client dependencies for High/Critical vulnerabilities..."
          npm audit --prefix client --audit-level=high
          echo "Scanning server dependencies for High/Critical vulnerabilities..."
          npm audit --prefix server --audit-level=high

  # --------------------------------------------------------------------------
  # 2. Automated Test Suite & Production Bundle Build
  # --------------------------------------------------------------------------
  test-and-build:
    name: Test Suite & Bundle Verification
    runs-on: ubuntu-latest
    needs: [dependency-audit]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --prefix client
          npm ci --prefix server

      - name: Run Client Vitest Test Suite
        run: npm run test --prefix client -- --run

      - name: Compile & Build Frontend Production Bundle
        run: npm run build --prefix client

      - name: Compile Backend TypeScript
        run: npm run build --prefix server

  # --------------------------------------------------------------------------
  # 3. Static Application Security Testing (CodeQL SAST)
  # --------------------------------------------------------------------------
  codeql-analysis:
    name: CodeQL Static Security Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis Engine
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  # --------------------------------------------------------------------------
  # 4. Container Vulnerability Scanning with Trivy
  # --------------------------------------------------------------------------
  container-vulnerability-scan:
    name: Trivy Container Image CVE Scan
    runs-on: ubuntu-latest
    needs: [test-and-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: |
          docker build -t tiger-workspace-crm:${{ github.sha }} .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: tiger-workspace-crm:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Fails CI if CRITICAL vulnerabilities exist
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
