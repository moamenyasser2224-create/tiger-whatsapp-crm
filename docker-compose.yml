services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_crm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-whatsapp_crm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-whatsapp_crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: whatsapp_crm_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-whatsapp_crm}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789}
      JWT_RESET_PASSWORD_SECRET: ${JWT_RESET_PASSWORD_SECRET:-reset_secret_key_minimum_32_characters_long_1234567890}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      SECURE_COOKIE: "false"
      ENABLE_RLS: "false"
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: whatsapp_crm_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local
